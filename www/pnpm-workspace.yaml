# Never resolve a version published less than 7 days ago (minutes).
minimumReleaseAge: 10080

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# Move transitive dependencies off versions with published advisories, within
# the same major, using releases at least 14 days old.
