  '@ungap/structured-clone@1': 1.3.3
  baseline-browser-mapping@2: 2.11.35
  browserslist@4: 4.29.5
  image-size@2: 2.0.4
  js-yaml@4: 4.3.2
  nanoid@3: 3.3.20
  path-to-regexp@8: 8.4.2
  picomatch@4: 4.0.7
  postcss@8: 8.5.32
  postcss-selector-parser@7: 7.1.7
  rollup@4: 4.60.4
  source-map-js@1: 1.2.2
  undici@7: 7.30.1
  vite@7: 7.3.7
  ws@8: 8.22.1
  zod@4: 4.6.7
