shamefullyHoist: true
strictPeerDependencies: false

# Never resolve a version published less than 7 days ago (minutes).
minimumReleaseAge: 10080

allowBuilds:
  esbuild: true

# Move dev-only transitive dependencies (vitest -> vite -> rollup/postcss) off
# versions with published advisories, within the same major.
overrides:
  nanoid: 3.3.20
  picomatch: 4.0.7
  postcss: 8.5.32
  rollup: 4.60.4
  source-map-js: 1.2.2
  vite: 7.3.7
